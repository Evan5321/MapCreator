# 语义调色板：颜色/字号/线宽只在这里定义，Python 与样式生成不得硬编码
# kind 的 color_token 指向下面的 [label.*] / [poi.*] 条目

[surface]
background = "#0b1020"
land = "#2f3b2a"
land_border = "#4c5a42"
water = "#16324f"
water_border = "#1f4468"
park = "#3c5430"
terrain = "#4a4235"

[line]
river = "#2f6f9e"
river_width_z7 = 1.0
river_width_z12 = 3.0
road_casing = "#1d1d1d"
road = "#b9a37c"
road_width_z9 = 0.8
road_width_z14 = 3.2
rail_dash = "#d8d2c4"

[transit]
metro = "#d94f4f"
bus = "#e0a33a"
rail = "#7b8fa1"

[labels]
halo = "#0b1020"
halo_width = 1.4

# 语义标签 token：kinds.toml 的 color_token 直接引用这些（带点号的键名，用引号包住）
["label.nature"]
color = "#cfd8b0"

["label.water"]
color = "#9dc4e0"

["label.political"]
color = "#f2e7d0"

["label.transit"]
color = "#e6e6e6"

["label.facility"]
color = "#f0d9a8"

[poi]
halo = "#0b1020"
size_z12 = 14
size_z15 = 18

[typography]
# rank → 字号（px）：z7-12 / z13-17
font_family = "Noto Sans Regular"
rank1 = [18, 20]
rank2 = [15, 17]
rank3 = [13, 15]
rank4 = [12, 14]
rank5 = [11, 13]
