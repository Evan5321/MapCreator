# 缩放带：带边界是唯一权威（D-018）
# 文件名由 name 派生：labels.<name>.geojson / lines.<name>.geojson / polygons.<name>.geojson
# kinds.toml 的 default_min/max_zoom 只产生 style filter，绝不反推这里的边界。

[[bands]]
name = "z0-3"
min_zoom = 0
max_zoom = 3
simplify_tolerance = 0.02

