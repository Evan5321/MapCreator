# kind 注册表：决定 label_mode / 默认 rank / 默认缩放区间 / 图标 / 颜色 token / 属性 schema
# 与 docs/DATA_SPEC.md §8 必须一致（validate 会比对）。
# 新增 kind 需同时提供：schemas/kinds/<kind>.schema.json、图标（point 类）、palette.toml token。

# ---------- 自然 / 面状 ----------
[kinds.continent]
label_mode = "point"
default_rank = 1
default_min_zoom = 0.0
default_max_zoom = 8.0
color_token = "label.nature"
attrs_schema = "schemas/kinds/_empty.schema.json"

[kinds.ocean]
label_mode = "point"
default_rank = 1
default_min_zoom = 0.0
default_max_zoom = 7.0
